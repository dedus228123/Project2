<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Gallery</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="nav">
        <a class="nav__link" href="index.html">Главная</a>
        <a class="nav__link" href="music.html">Музыка</a>
        <a class="nav__link" href="gallery.html">Галерея</a>
        <a class="nav__link nav__link_active" href="contacts.html">Контакты</a>
    </nav>
        <main class="container">
            <h1>Это контакты</h1>
            <form class="contact-form">
                <label class="contact-form__label" for="name">Имя</label>
                <input class="contact-form__input" type="text" id="name" name="name" placeholder="Введите имя" required>
                <label class="contact-form__label" for="email">Email</label>
                <input class="contact-form__input" type="email" id="email" name="email" placeholder="you@example.com" required>
                <label class="contact-form__label" for="message">Сообщение</label>
                <textarea class="contact-form__textarea" id="message" name="message" rows="5" placeholder="Напишите что-нибудь..." required></textarea>
                <button class="contact-form__button" type="submit">Отправить</button>
            </form>
        </main>
    
</body>
</html>
